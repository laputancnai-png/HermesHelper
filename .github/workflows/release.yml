name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Hermes Manager ${{ github.ref_name }}"
          releaseBody: "See the assets below to download and install."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload stable-name asset (macOS Apple Silicon)
        if: matrix.args == '--target aarch64-apple-darwin'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SRC=$(ls src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/hermes-manager_*.dmg | head -1)
          cp "$SRC" "hermes-manager-latest-macos-arm64.dmg"
          gh release upload "$GITHUB_REF_NAME" "hermes-manager-latest-macos-arm64.dmg" --clobber

      - name: Upload stable-name asset (macOS Intel)
        if: matrix.args == '--target x86_64-apple-darwin'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SRC=$(ls src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/hermes-manager_*.dmg | head -1)
          cp "$SRC" "hermes-manager-latest-macos-x64.dmg"
          gh release upload "$GITHUB_REF_NAME" "hermes-manager-latest-macos-x64.dmg" --clobber

      - name: Upload stable-name assets (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SRC_APPIMAGE=$(ls src-tauri/target/release/bundle/appimage/hermes-manager_*.AppImage | head -1)
          SRC_DEB=$(ls src-tauri/target/release/bundle/deb/hermes-manager_*.deb | head -1)
          SRC_RPM=$(ls src-tauri/target/release/bundle/rpm/hermes-manager-*.rpm | head -1)
          cp "$SRC_APPIMAGE" "hermes-manager-latest-linux-x64.AppImage"
          cp "$SRC_DEB" "hermes-manager-latest-linux-x64.deb"
          cp "$SRC_RPM" "hermes-manager-latest-linux-x64.rpm"
          gh release upload "$GITHUB_REF_NAME" \
            "hermes-manager-latest-linux-x64.AppImage" \
            "hermes-manager-latest-linux-x64.deb" \
            "hermes-manager-latest-linux-x64.rpm" \
            --clobber

  publish:
    needs: release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false --latest --repo "${{ github.repository }}"
